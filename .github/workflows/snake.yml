name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit
  workflow_dispatch:       # bouton "Run workflow" manuel
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF0000&color_dots=#ebedf0,#ffcccc,#ff8080,#ff3333,#cc0000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF0000&color_dots=#161b22,#4a0000,#8b0000,#c80000,#ff0000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
